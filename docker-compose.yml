version: "3.8"

services:
  decisionbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: decisionbench:latest
    container_name: decisionbench
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      # Optional: set OPENROUTER_API_KEY directly or configure in web UI
      # - OPENROUTER_API_KEY=sk-or-v1-...
      # Optional: set custom Fernet 32-byte base64 encryption key
      # - DECISIONBENCH_SECRET_KEY=...
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
